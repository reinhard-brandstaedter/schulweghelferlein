# kubectl apply -k .
# Liegt im Projektstamm, damit config.yaml ohne Kopie als ConfigMap eingebunden wird.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: schulweghelferlein
resources:
  - k8s/namespace.yaml
  - k8s/pvc.yaml
  - k8s/deployment.yaml
  - k8s/service.yaml
configMapGenerator:
  - name: schulweghelferlein-config
    files:
      - config.yaml
