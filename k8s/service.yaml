# Wie die anderen Homelab-Dienste über MetalLB (Pool 192.168.1.230–245) mit fester IP.
apiVersion: v1
kind: Service
metadata:
  name: schulweghelferlein
  annotations:
    metallb.io/loadBalancerIPs: 192.168.1.232
spec:
  type: LoadBalancer
  selector: { app: schulweghelferlein }
  ports:
    - name: http
      port: 80
      targetPort: 8000
